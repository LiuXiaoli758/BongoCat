name: Build BongoCat

on:
  workflow_dispatch: # 手动触发，不随push自动跑
jobs:
  build-windows:
    runs-on: windows-latest
    env:
      TAURI_SKIP_SIGNING: true
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: List project structure (debug)
        run: |
          dir
          dir src-tauri

      - name: Build Tauri app (skip signing)
        working-directory: src-tauri
        run: npm run tauri build -- --no-sign

      - name: List build output (debug)
        working-directory: src-tauri
        run: |
          dir target
          dir target\release
          dir target\release\bundle

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BongoCat-Windows
          path: src-tauri/target/release/bundle/

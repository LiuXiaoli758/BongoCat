name: Build BongoCat

on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    env:
      TAURI_SKIP_SIGNING: true
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # ========= 删除 cache: 'pnpm' 这一行！ =========

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: List project structure (debug)
        run: |
          dir
          dir src-tauri

      - name: Build Tauri app (skip signing)
        run: pnpm tauri build --no-sign

      - name: List build output (debug)
        run: |
          if(Test-Path target){
            dir target
            if(Test-Path target\release){
              dir target\release
              if(Test-Path target\release\bundle){
                dir target\release\bundle
              }
            }
          } else {
            Write-Host "target文件夹不存在"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BongoCat-Windows
          path: target/release/bundle/

name: BongoCat Build Only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      # 关闭tauri签名
      TAURI_SKIP_SIGNING: true
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri app (skip signing)
        run: pnpm tauri build --no-sign

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BongoCat-Windows
          path: src-tauri/target/release/bundle/
